<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Portable</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="logo">OC</div>
        <div>
          <span class="eyebrow">PORTABLE LAUNCHER</span>
          <h1>OpenClaw 便携版</h1>
        </div>
        <span id="status-pill" class="pill">检查中</span>
      </header>

      <section class="grid top-grid">
        <div class="panel metric">
          <span>运行时</span>
          <strong id="runtime-status">-</strong>
        </div>
        <div class="panel metric wide">
          <span>本地控制台</span>
          <strong id="gateway-url">http://127.0.0.1:18789</strong>
        </div>
        <div class="panel metric">
          <span>剩余额度</span>
          <strong id="quota-summary">-</strong>
        </div>
      </section>

      <section class="content-grid">
        <section class="panel form-panel">
          <span class="eyebrow">API</span>
          <h2>模型与密钥</h2>
          <p id="message" class="message"></p>

          <label>
            <span>API Key</span>
            <input id="api-key" type="password" autocomplete="off" placeholder="填写客户自己的 API Key" />
          </label>

          <label>
            <span>本地端口</span>
            <input id="port" type="number" min="1024" max="65535" step="1" placeholder="18789" />
          </label>

          <label>
            <span>模型</span>
            <div class="select-display">
              <strong>gpt-5.5</strong>
              <small>固定模型</small>
            </div>
          </label>

          <label class="check-row">
            <input id="launch-on-open" type="checkbox" />
            <span>打开应用时自动启动</span>
          </label>

          <div class="button-row">
            <button id="save" class="primary">保存配置</button>
            <button id="refresh-quota">刷新额度</button>
          </div>
        </section>

        <aside class="stack">
          <section class="panel quota-panel">
            <div class="panel-title">
              <div>
                <span class="eyebrow">QUOTA</span>
                <h2>当前额度</h2>
              </div>
              <button id="quota-button" class="small">刷新</button>
            </div>
            <div class="quota-grid">
              <div><span>总额度</span><strong id="quota-total">-</strong></div>
              <div><span>已使用</span><strong id="quota-used">-</strong></div>
              <div><span>剩余</span><strong id="quota-remaining">-</strong></div>
            </div>
            <p id="quota-note">保存 API Key 后可查看当前额度。</p>
          </section>

          <section class="panel control-panel">
            <span class="eyebrow">CONTROL</span>
            <h2>运行控制</h2>
            <button id="start" class="primary big">启动 OpenClaw</button>
            <button id="open" class="secondary big">打开控制界面</button>
            <button id="stop" class="secondary big">停止</button>
          </section>
        </aside>
      </section>

      <section class="panel maintenance">
        <div>
          <span class="eyebrow">DATA</span>
          <h2>维护</h2>
          <p>清空本机的 OpenClaw 会话、记忆、缓存和历史状态。</p>
        </div>
        <button id="reset" class="danger">重置用户数据</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
