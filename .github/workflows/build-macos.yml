name: Build macOS OpenClaw Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "main.js"
      - "preload.js"
      - "renderer/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TARGET_ARCH: ${{ matrix.arch }}
      OPENCLAW_VERSION: "2026.5.27"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install launcher dependencies
        run: npm install

      - name: Prepare bundled OpenClaw runtime
        run: npm run prepare:runtime

      - name: Verify runtime
        run: |
          ./runtime/openclaw-env/nodejs/node-v*/bin/node ./runtime/openclaw-env/node_modules/openclaw/openclaw.mjs --help >/tmp/openclaw-help.txt
          head -20 /tmp/openclaw-help.txt
          test -f ./runtime/openclaw-env/node_modules/openclaw/node_modules/typebox/package.json

      - name: Build macOS package
        run: npm run dist:mac -- --${{ matrix.arch }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Portable-mac-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
