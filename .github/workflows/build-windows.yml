name: Build Windows OpenClaw Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "main.js"
      - "preload.js"
      - "renderer/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TARGET_PLATFORM: "win32"
      TARGET_ARCH: "x64"
      OPENCLAW_VERSION: "2026.5.27"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install launcher dependencies
        run: npm install

      - name: Prepare bundled OpenClaw runtime
        run: npm run prepare:runtime

      - name: Verify runtime
        shell: pwsh
        run: |
          $node = Get-ChildItem -Path .\runtime\openclaw-env\nodejs -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $node) { throw "node.exe not found" }
          & $node.FullName .\runtime\openclaw-env\node_modules\openclaw\openclaw.mjs --help | Select-Object -First 20
          if (-not (Test-Path .\runtime\openclaw-env\node_modules\openclaw\node_modules\typebox\package.json)) { throw "typebox missing" }

      - name: Build Windows package
        run: npm run dist:win -- --x64

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Portable-windows-x64
          path: dist/*
          if-no-files-found: error
